name: Test Redistribute

on:
  push:
    branches:
      - master
  pull_request:
permissions: {}


jobs:
  test-redistribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Build source distribution
        run: uv build --sdist
      - name: Test source distribution
        run: |
          tar -xzf dist/fastapi-*.tar.gz -C dist
          cd dist/fastapi-*
          uv sync --all-extras --group tests
          uv run bash scripts/test.sh
      - name: Build wheel from source distribution
        run: |
          cd dist/fastapi-*
          uv build --wheel
  test-redistribute-alls-green:
    needs: test-redistribute
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
