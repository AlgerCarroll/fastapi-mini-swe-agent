name: Build Docs
on:
  push:
    branches:
      - master
  pull_request:
permissions: {}


jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'README.md'
              - 'docs/**'
              - 'docs_src/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/build-docs.yml'
              - 'scripts/docs.py'

  langs:
    needs:
      - changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.langs.outputs.langs }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group docs --no-dev
      - name: Get languages
        id: langs
        run: echo "langs=$(uv run python scripts/docs.py langs-json)" >> "$GITHUB_OUTPUT"

  build-docs:
    needs:
      - changes
      - langs
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        lang: ${{ fromJSON(needs.langs.outputs.langs) }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group docs --no-dev
      - name: Update languages
        run: uv run python scripts/docs.py update-languages
      - name: Build docs
        run: uv run python scripts/docs.py build-lang "${{ matrix.lang }}"
      - name: Upload docs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-${{ matrix.lang }}
          path: |
            site
            !site/${{ matrix.lang }}/img/**
            !site/${{ matrix.lang }}/css/**
            !site/${{ matrix.lang }}/js/**
          include-hidden-files: true

  docs-all-green:
    needs:
      - langs
      - build-docs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
